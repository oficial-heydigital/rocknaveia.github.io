<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - Rock na Véia</title>

    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="assets/js/events.js" defer></script>
</head>
<body>
    <div data-include="header"></div>

    <main class="mt-5 pt-4">
        <section class="py-5">
            <div class="container">
                <h1 class="mb-4">Calendário de Eventos</h1>
                <p class="lead">Confira os próximos shows da banda. Clique em um evento para ver mais detalhes ou comprar ingressos.</p>

                <div class="row mt-4">
                    <div class="col-lg-7 mb-4">
                        <div id="calendar" class="p-3 bg-white rounded shadow-sm"></div>
                    </div>
                    <div class="col-lg-5">
                        <h2>Próximos Shows</h2>
                        <ul id="events" class="list-group mt-3"></ul>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-include="footer"></div>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="assets/js/main.js" defer></script>

    <script>
        // Fetch and display events from data/events.json
        fetch('data/events.json')
            .then(response => response.json())
            .then(data => {
                const eventsContainer = document.getElementById('events');
                if(!eventsContainer) return;
                data.forEach(event => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-start';
                    li.innerHTML = `
                        <div class="ms-2 me-auto">
                            <div class="fw-bold">${event.title || event.location}</div>
                            <div>${event.date} • ${event.time} — ${event.location}</div>
                        </div>
                        <a class="btn btn-sm btn-outline-primary" href="${event.ticketLink || '#'}" target="_blank">Ingressos</a>
                    `;
                    eventsContainer.appendChild(li);
                });
            })
            .catch(error => console.error('Erro ao carregar eventos:', error));
    </script>
</body>
</html>
